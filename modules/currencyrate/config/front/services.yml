  CurrencyRate\Application\History\HistoryRateRowCollectionMapper: ~
  CurrencyRate\Application\History\HistoryViewProvider: ~

  # Presentation mappers (FO templates)
  CurrencyRate\Application\View\HistoryRateRowViewMapper: ~