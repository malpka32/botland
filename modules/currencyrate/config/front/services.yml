imports:
  - { resource: '../services.yml' }

services:
  _defaults:
    public: true
    autoconfigure: false
    autowire: true

  # History listing (FO controller)
  CurrencyRate\Application\History\RateHistoryReader: ~
  CurrencyRate\Application\History\CachedRateHistoryReader:
    arguments:
      - '@CurrencyRate\Application\History\RateHistoryReader'
      - '@CurrencyRate\Application\Cache\RateHistoryCacheInterface'
      - '@CurrencyRate\Application\Log\DebugLoggerInterface'
  CurrencyRate\Application\History\RateHistoryReaderInterface: '@CurrencyRate\Application\History\CachedRateHistoryReader'
  CurrencyRate\Application\History\HistoryRateRowCollectionMapper: ~
  CurrencyRate\Application\History\HistoryViewProvider: ~

  # Presentation mappers (FO templates)
  CurrencyRate\Application\View\HistoryRateRowViewMapper: ~