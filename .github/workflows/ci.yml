name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    name: Lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: phpunit
          coverage: none

      - name: PHP syntax lint
        working-directory: modules/currencyrate
        run: bash scripts/lint-php.sh

      - name: Run unit tests
        working-directory: modules/currencyrate
        run: phpunit -c phpunit.xml.dist

  build_zip:
    name: Build module ZIP
    runs-on: ubuntu-latest
    needs: qa
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Ensure build script is executable
        run: chmod +x scripts/build-module-zip.sh

      - name: Build ZIP artifact
        run: ./scripts/build-module-zip.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: currencyrate-zip
          path: dist/*.zip
          if-no-files-found: error
